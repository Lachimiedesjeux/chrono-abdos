<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="apple-touch-icon" href="icon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Abdos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 20px 10px;
            box-sizing: border-box;
        }
        
        header h1 { font-size: 1.2rem; color: #94a3b8; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Permet de pousser la barre tout en bas */
            flex-grow: 1;
            margin: 10px 0;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #334155;
            border-radius: 8px;
            height: 8px;
            margin-top: 15px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #eab308; /* Jaune bien visible */
            transition: width 0.2s linear;
        }

        #phase-label { font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        #exercise-name { font-size: 1.8rem; font-weight: bold; margin: 10px 0; min-height: 2.4rem; display: flex; align-items: center; justify-content: center; }
        
        #exercise-img { 
            max-width: 100%; 
            max-height: 25vh; 
            border-radius: 8px; 
            display: none; 
            margin: 10px 0; 
            object-fit: contain; 
        }

        #timer { 
            font-size: 5rem; 
            font-weight: 800; 
            margin: 10px 0; 
            font-variant-numeric: tabular-nums;
        }
        
        #next-exercise { font-size: 1.2rem; font-weight: 500; color: #cbd5e1; min-height: 1.8rem; margin-top: 15px; }
        
        .work { color: #22c55e; } /* Vert */
        .rest { color: #ef4444; } /* Rouge */
        
        .btn-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        button:active { opacity: 0.8; }

        #start-btn { background-color: #3b82f6; }
        #pause-btn { background-color: #eab308; display: none; color: #0f172a; }
        #stop-btn { background-color: #ef4444; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Séance Abdos</h1>
    </header>

    <div class="card">
        <!-- Contenu central -->
        <div class="card-content">
            <div id="phase-label" class="work">Prêt</div>
            <div id="exercise-name">Appuyer sur Démarrer</div>
            <img id="exercise-img" src="" alt="Illustration mouvement">
            <div id="timer" class="work">--</div>
            <div id="next-exercise"></div>
        </div>

        <!-- Barre de progression positionnée en bas de la carte -->
        <div class="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div class="btn-container">
        <button id="start-btn">Démarrer</button>
        <button id="pause-btn">Pause</button>
        <button id="stop-btn">Stop / Reset</button>
    </div>

    <script>
        const exercices = [
            { name: "Dead Bug", img: "1DeadBug.png" },
            { name: "Oblique", img: "2Oblique.png" },
            { name: "Hollow Statique", img: "3HollowStatique.png" },
            { name: "Sit-up", img: "4Situp.png" },
            { name: "Planche", img: "5Planche" },
            { name: "Planche Latérale G", img: "6PlancheLatG.png" },
            { name: "Planche Latérale D", img: "7PlancheLatD.png" },
            { name: "Hollow Dynamique", img: "8Hollow Dynamique.png" },
            { name: "Dead Bug + Genou Opp", img: "9DeadBugGenou.png" },
            { name: "Rameur", img: "10Rameur.png" },
            { name: "Dead Bug", img: "1DeadBug.png" },
            { name: "Oblique", img: "2Oblique.png" },
            { name: "Hollow Statique", img: "3HollowStatique.png" },
            { name: "Sit-up", img: "4Situp.png" },
            { name: "Planche", img: "5Planche" },
            { name: "Planche Latérale G", img: "6PlancheLatG.png" },
            { name: "Planche Latérale D", img: "7PlancheLatD.png" },
            { name: "Hollow Dynamique", img: "8Hollow Dynamique.png" },
            { name: "Dead Bug + Genou Opp", img: "9DeadBugGenou.png" },
            { name: "Rameur", img: "10Rameur.png" },
        ];

        const WORK_TIME = 30;
        const REST_TIME = 10;
        
        const TOTAL_SESSION_SECONDS = (exercices.length * WORK_TIME) + ((exercices.length - 1) * REST_TIME);
        
        let currentIndex = 0;
        let isWorkPhase = true;
        let timeLeft = 0;
        let interval = null;
        let isPaused = false;
        let audioCtx = null;

        const timerEl = document.getElementById('timer');
        const nameEl = document.getElementById('exercise-name');
        const phaseLabelEl = document.getElementById('phase-label');
        const imgEl = document.getElementById('exercise-img');
        const nextEl = document.getElementById('next-exercise');
        const progressBarEl = document.getElementById('progress-bar');
        
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const stopBtn = document.getElementById('stop-btn');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep(highPitch = false) {
            try {
                initAudio();
                if (!audioCtx) return;

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.value = highPitch ? 880 : 440;
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function playVictorySound() {
            try {
                initAudio();
                if (!audioCtx) return;
                
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, now + (index * 0.12));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (index * 0.12) + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + (index * 0.12));
                    osc.stop(now + (index * 0.12) + 0.2);
                });
            } catch (e) {}
        }

        function getElapsedSeconds() {
            let elapsed = 0;
            for (let i = 0; i < currentIndex; i++) {
                elapsed += WORK_TIME;
                if (i < exercices.length - 1) {
                    elapsed += REST_TIME;
                }
            }
            const currentPhaseDuration = isWorkPhase ? WORK_TIME : REST_TIME;
            elapsed += (currentPhaseDuration - timeLeft);
            return elapsed;
        }

        function updateDisplay() {
            let elapsed = getElapsedSeconds();
            let progressPercent = (elapsed / TOTAL_SESSION_SECONDS) * 100;
            if (progressPercent > 100) progressPercent = 100;
            if (currentIndex >= exercices.length) progressPercent = 100;
            
            progressBarEl.style.width = progressPercent + "%";

            if (currentIndex >= exercices.length) {
                phaseLabelEl.textContent = "Terminé 🎉";
                phaseLabelEl.className = "work";
                nameEl.textContent = "Bravo, exercice terminé !";
                timerEl.textContent = "🏆";
                timerEl.className = "work";
                imgEl.style.display = "none";
                nextEl.textContent = "Séance d'abdos validée avec succès !";
                
                startBtn.textContent = "Recommencer";
                startBtn.style.display = "block";
                pauseBtn.style.display = "none";
                stopBtn.style.display = "none";
                return;
            }

            const currentEx = exercices[currentIndex];
            const nextEx = exercices[currentIndex + 1];

            if (isWorkPhase) {
                phaseLabelEl.textContent = "Effort";
                phaseLabelEl.className = "work";
                nameEl.textContent = currentEx.name;
                timerEl.className = "work";
                
                if (currentEx.img) {
                    imgEl.src = currentEx.img;
                    imgEl.style.display = "block";
                } else {
                    imgEl.style.display = "none";
                }
                nextEl.textContent = nextEx ? "Suivant : " + nextEx.name : "Dernier exercice !";
            } else {
                phaseLabelEl.textContent = "Repos";
                phaseLabelEl.className = "rest";
                nameEl.textContent = "Récupération";
                timerEl.className = "rest";
                imgEl.style.display = "none";
                nextEl.textContent = "À suivre : " + currentEx.name;
            }
            
            timerEl.textContent = timeLeft;
        }

        function tick() {
            if (isPaused) return;

            timeLeft--;

            if (timeLeft > 0 && timeLeft <= 3) {
                playBeep(false);
            } else if (timeLeft === 0) {
                playBeep(true);
            }

            if (timeLeft <= 0) {
                clearInterval(interval);
                
                if (isWorkPhase) {
                    currentIndex++;
                    if (currentIndex < exercices.length) {
                        isWorkPhase = false;
                        timeLeft = REST_TIME;
                        startTimer();
                    } else {
                        playVictorySound();
                        updateDisplay();
                        return;
                    }
                } else {
                    isWorkPhase = true;
                    timeLeft = WORK_TIME;
                    startTimer();
                }
            }
            updateDisplay();
        }

        function startTimer() {
            updateDisplay();
            interval = setInterval(tick, 1000);
        }

        startBtn.addEventListener('click', () => {
            initAudio();
            playBeep(true);

            if (startBtn.textContent === "Recommencer") {
                resetApp();
                return;
            }

            startBtn.style.display = 'none';
            pauseBtn.style.display = 'block';
            stopBtn.style.display = 'block';
            pauseBtn.textContent = "Pause";
            isPaused = false;

            if (timeLeft === 0) {
                currentIndex = 0;
                isWorkPhase = true;
                timeLeft = WORK_TIME;
            }
            startTimer();
        });

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.textContent = "Reprendre";
                phaseLabelEl.textContent = "En pause";
            } else {
                pauseBtn.textContent = "Pause";
                phaseLabelEl.textContent = isWorkPhase ? "Effort" : "Repos";
            }
        });

        function resetApp() {
            clearInterval(interval);
            isPaused = false;
            currentIndex = 0;
            isWorkPhase = true;
            timeLeft = 0;
            
            progressBarEl.style.width = "0%";
            phaseLabelEl.textContent = "Prêt";
            phaseLabelEl.className = "work";
            nameEl.textContent = "Appuyer sur Démarrer";
            timerEl.textContent = "--";
            timerEl.className = "work";
            imgEl.style.display = "none";
            nextEl.textContent = "";

            startBtn.textContent = "Démarrer";
            startBtn.style.display = "block";
            pauseBtn.style.display = "none";
            pauseBtn.textContent = "Pause";
            stopBtn.style.display = "none";
        }

        stopBtn.addEventListener('click', resetApp);
    </script>
</body>
</html>
